name: ps-demo

services:
  aas-registry:
    image: eclipsebasyx/aas-registry-log-mem:2.0.0-SNAPSHOT
    container_name: ps-aas-registry
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/shell-descriptors"]
      interval: 3s
      timeout: 2s
      retries: 20

  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mem:2.0.0-SNAPSHOT
    container_name: ps-sm-registry
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/submodel-descriptors"]
      interval: 3s
      timeout: 2s
      retries: 20

  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-SNAPSHOT
    container_name: ps-aas-discovery
    ports:
      - "8084:8081"
    environment:
      SERVER_PORT: 8081
      BASYX_BACKEND: InMemory
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/lookup/shells"]
      interval: 3s
      timeout: 2s
      retries: 20

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
    container_name: ps-aas-environment
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      BASYX_BACKEND: InMemory
      BASYX_CORS_ALLOWED_ORIGINS: '*'
      BASYX_CORS_ALLOWED_METHODS: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION: http://aas-discovery:8081
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://aas-registry:8080
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://sm-registry:8080
      BASYX_EXTERNALURL: http://localhost:8081
    depends_on:
      aas-registry:
        condition: service_healthy
      sm-registry:
        condition: service_healthy
      aas-discovery:
        condition: service_healthy

  aas-web-ui:
    # Built from this working tree, not the published SNAPSHOT image.
    image: basyx-aas-web-ui:processsequence
    build:
      context: ../../aas-web-ui
      dockerfile: ../examples/ProcessSequence/Dockerfile
    container_name: ps-aas-web-ui
    ports:
      - "3000:3000"
    environment:
      AAS_REGISTRY_PATH: http://localhost:8082/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://localhost:8083/submodel-descriptors
      AAS_REPO_PATH: http://localhost:8081/shells
      SUBMODEL_REPO_PATH: http://localhost:8081/submodels
      CD_REPO_PATH: http://localhost:8081/concept-descriptions
      AAS_DISCOVERY_PATH: http://localhost:8084/lookup/shells
    depends_on:
      - aas-environment

  seed-process-plan:
    image: node:24-slim
    environment:
      PS_REPO_URL: http://aas-environment:8081
    volumes:
      - ../../aas-web-ui/src/pages/modules/ProcessSequence:/module:ro
    command: ["node", "/module/demo/seed.ts"]
    depends_on:
      aas-environment:
        condition: service_healthy
    restart: "no"
